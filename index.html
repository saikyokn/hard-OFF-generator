<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript External Script Loader</title>

    <!-- PyScriptの読み込み -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body { font-family: sans-serif; margin: 30px; line-height: 1.6; }
        .container { max-width: 600px; border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        #status { color: green; font-weight: bold; margin-bottom: 15px; }
        #output { margin-top: 15px; padding: 10px; background-color: #f0f0f0; border-radius: 4px; }
        input, button { padding: 8px; margin: 5px 0; font-size: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>外部Pythonスクリプト起動デモ</h2>
        
        <!-- 読み込み状態表示 -->
        <div id="status">Pythonスクリプトを読み込み中...</div>

        <div>
            <label for="user_input">文字列を入力:</label><br>
            <input type="text" id="user_input" value="hello python" style="width: 80%;"><br>
            <button py-click="run_script">main.py の関数を実行</button>
        </div>

        <div id="output">ここに結果が表示されるクレメンス</div>
    </div>

    <!-- src属性で外部の .py ファイルを指定して起動 -->
    <script type="py" src="main.py" config='{"packages": []}'></script>

</body>
</html>
